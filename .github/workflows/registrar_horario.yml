name: Executar Automação Carômetro

on:
  # Permite o disparo via API pelo cron-job.org e botão manual no GitHub
  workflow_dispatch:

  # Agendamento nativo como backup (opcional)
  schedule:
    - cron: '*/5 * * * *'

jobs:
  executar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Google Chrome no servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Automação Selenium
        run: python main.py

      - name: Salvar atualização dos Logs no Repositório
        if: always()
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add *.txt
          git commit -m "Atualizando registros de acesso [skip ci]" || exit 0
          git push

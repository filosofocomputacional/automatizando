name: Registrar Horário da Cidade

on:
  workflow_dispatch:
    inputs:
      cidade:
        description: 'Nome da Cidade (ex: São Paulo, Nova York, Buenos Aires)'
        required: true
        default: 'São Paulo'

  schedule:
    # Executa a cada 5 minutos
    - cron: '*/5 * * * *'

jobs:
  registrar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar registro de horário
        env:
          CIDADE_ESCOLHIDA: ${{ inputs.cidade || 'São Paulo' }}
        run: python main.py

      - name: Salvar atualização no repositório
        if: always()
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add registro_horarios.txt
          git commit -m "Atualizando horário registrado [skip ci]" || exit 0
          git push
